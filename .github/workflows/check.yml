name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reproduce the main numbers
        run: |
          pip install numpy
          python reproduce/reproduce_tables.py data/episodes | tee reproduce.log
          grep -q "ALL NUMBERS REPRODUCED" reproduce.log
      - name: Build the paper
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          cd paper && ../tectonic main.tex
      - name: Page budget and a clean tree
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          python tools/check_repo.py --pdf paper/main.pdf
